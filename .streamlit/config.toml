[theme]
base = "dark"
primaryColor = "#818CF8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#141B33"
textColor = "#F1F5F9"
font = "sans serif"

[server]
maxUploadSize = 25
headless = true
enableXsrfProtection = false
enableCORS = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
